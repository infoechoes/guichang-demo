<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商品查价 · 贵昌</title><link rel="stylesheet" href="/assets/price-lookup.css"></head><body><main><header><div><p class="eyebrow">贵昌 · 商品查价</p><h1>找商品，核价格</h1><p>政企商品核对型号与包装；食材行情从独立入口查询。</p></div><span class="source">政企商品</span></header><nav style="justify-content:flex-start;gap:10px" class="toolbar" aria-label="查价业务"><button id="mode-goods" type="button" class="primary" aria-pressed="true">政企商品</button><button id="mode-food" type="button" aria-pressed="false">食材行情</button></nav><form id="search"><label class="query"><span id="query-label">商品名称 / 型号</span><input id="query" maxlength="120" placeholder="例如：惠普 915XL 黑色 原装" required></label><label id="goods-source-label">电商数据源<select id="platform"><option value="justone-jd">JustOne · 京东</option><option value="justone-taobao">JustOne · 淘宝 / 天猫</option><option value="xinfadi" hidden>新发地 · 食材行情</option><option value="jd">买手 · 京东</option><option value="taobao">买手 · 淘宝 / 天猫</option><option disabled>拼多多（待授权）</option></select></label><label id="market-date-label">行情日期<input id="market-date" type="date"><small>留空查近 7 天最新行情</small></label><button id="submit" class="primary">查询参考价</button></form><div class="examples">试查：<button type="button" data-query="惠普 915XL 黑色 原装">惠普 915XL</button><button type="button" data-query="维融 I7 验钞机">维融 I7</button><button type="button" data-query="乐普 PC-60A 血氧仪">乐普 PC-60A</button></div><p class="notice">参考价不等于最终报价。商品可能包含多个规格；请在来源页确认型号、数量、优惠条件和运费。</p><div class="toolbar"><p id="status" role="status">输入商品信息开始查询。</p><button id="export" disabled>导出参考结果 CSV</button></div><div id="results"></div><p class="footnote">本页不会自动采用最低价、写入订单或生成已核验的三方报价。推广链接可能与搜索展示的规格不同。</p></main><dialog id="detail"><button id="close" class="close" aria-label="关闭详情">关闭</button><div id="detail-body"></div></dialog><script src="/assets/xinfadi-entry.js"></script><script type="module" src="/assets/price-lookup.js"></script></body></html>
